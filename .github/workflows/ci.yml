name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nirikshan_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        working-directory: backend
        run: |
          uv pip install --system -e ".[dev]"
      
      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/nirikshan_test
          JWT_SECRET: test-jwt-secret-for-ci-pipeline-min-32-characters
          CORS_ORIGINS: '["http://localhost:3000"]'
          FRONTEND_URL: http://localhost:3000
          ENV: testing
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml
      
      - name: Check test coverage threshold
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/nirikshan_test
          JWT_SECRET: test-jwt-secret-for-ci-pipeline-min-32-characters
          CORS_ORIGINS: '["http://localhost:3000"]'
          FRONTEND_URL: http://localhost:3000
          ENV: testing
        run: |
          pytest tests/ --cov=src --cov-fail-under=75
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
  
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        working-directory: backend
        run: |
          uv pip install --system ruff mypy
      
      - name: Run ruff linter
        working-directory: backend
        run: |
          ruff check src/ --output-format=github || true
      
      - name: Run ruff formatter check
        working-directory: backend
        run: |
          ruff format --check src/ || true
  
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
  
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        working-directory: backend
        run: |
          docker build -t nirikshan-backend:${{ github.sha }} .
      
      - name: Save Docker image
        run: |
          docker save nirikshan-backend:${{ github.sha }} | gzip > backend-image.tar.gz
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: backend-image.tar.gz
          retention-days: 7
