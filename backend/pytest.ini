[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    auth: Authentication and authorization tests
    api: API endpoint tests
    ml: Machine learning prediction tests
    slow: Tests that take a long time to run
