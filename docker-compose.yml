services:
  postgres:
    image: postgres:16
    container_name: nirikshan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nirikshan
      POSTGRES_USER: nirikshan_user
      POSTGRES_PASSWORD: localdev123
    ports:
      - "5432:5432"
    volumes:
      - nirikshan_pgdata:/var/lib/postgresql/data
      - ./ml/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  nirikshan_pgdata: