services:
  postgres:
    image: postgres:16
    container_name: nirikshan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nirikshan
      POSTGRES_USER: nirikshan_user
      POSTGRES_PASSWORD: localdev123
    ports:
      - "5432:5432"
    volumes:
      - nirikshan_pgdata:/var/lib/postgresql/data
      - ./ml/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirikshan_user -d nirikshan"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: nirikshan_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://nirikshan_user:localdev123@postgres:5432/nirikshan
      ML_MODELS_PATH: /app/ml/models
    volumes:
      - ./ml/models:/app/ml/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nirikshan_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://nirikshan_user:localdev123@postgres:5432/nirikshan
      FASTAPI_BASE_URL: http://fastapi:8000
      JWT_SECRET: dev-secret-change-in-production
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
    command: npm start

volumes:
  nirikshan_pgdata: