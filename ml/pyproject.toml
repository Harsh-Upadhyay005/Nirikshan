[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harsh Upadhyay", email = "uharsh328@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "camelot-py>=2.0.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "psycopg2-binary>=2.9.12",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
ml = "ml:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
